name: Next.js Code Guardrails

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🚫 RULE 1: Block ONLY when a .yalc import is ADDED
      - name: Check for .yalc Imports
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+.*from ['\"].*\.yalc/.*['\"]"; then
            echo "❌ ERROR: New local .yalc import added! Please remove it before merging."
            exit 1
          fi

      # 🚫 RULE 2: Block ONLY when a console.log is ADDED
      - name: Check for console.log
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E "^\+.*console\.log" | grep -v "console.error" | grep -v "console.warn"; then
            echo "❌ ERROR: New console.log() added. Please clean up your debug logs."
            exit 1
          fi

      # 🚫 RUN TESTS & ESLINT
      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
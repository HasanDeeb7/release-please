name: Next.js Code Guardrails

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required for creating code line comments
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔍 Single Step to Scan and Comment on ALL Style/Log/Yalc Rules
      - name: Scan Diff for Rule Violations
        run: |
          # Initialize a tracker flag
          HAS_ERRORS=false

          # Process Substitution avoids subshell data loss bugs caused by piping (|)
          while read -r line; do
          
            # 📁 Track the current filename being inspected
            if [[ "$line" == "+++ b/"* ]]; then
              filename=$(echo "$line" | cut -c 7-)
          
            # 🔢 Track the active relative line number from the hunk header
            elif [[ "$line" == "@@"* ]]; then
              line_num=$(echo "$line" | sed -E 's/@@ .*\+([0-9]+).*/\1/')
          
            # 🔍 If it's a line addition line, parse it for our exact guardrail targets
            elif [[ "$line" == "+"* ]]; then
          
              # 🚫 Rule Check A: yalc imports — both path-based (.yalc/) and protocol-based (yalc:)
              if [[ "$line" == *".yalc/"* || "$line" == *'"yalc:'* || "$line" == *"'yalc:"* ]]; then
                echo "::error file=$filename,line=$line_num::❌ PR REJECTED: Local yalc link found. Remove yalc imports before merging."
                HAS_ERRORS=true
              fi

              # 🚫 Rule Check B: console.log additions
              if [[ "$line" == *"console.log"* && "$line" != *"console.error"* && "$line" != *"console.warn"* ]]; then
                echo "::error file=$filename,line=$line_num::❌ ERROR: Production code cannot contain console.log(). Use console.error or strip debug logs."
                HAS_ERRORS=true
              fi

              # 🚫 Rule Check C: Inline styles — flag style={{ unless the value references a JS variable
              # Matches style={{ but skips purely dynamic expressions like style={{ width: varName }}
              if [[ "$line" == *"style={{"* ]]; then
                # Allow if the only values after {{ are variable references (no string/number literals)
                # Extract the style value content and check for static literals
                style_content=$(echo "$line" | sed -E "s/.*style=\{\{([^}]*)\}\}.*/\1/")
                if echo "$style_content" | grep -qE "'[^']*'|\"[^\"]*\"|[[:space:]]:[[:space:]]*[0-9]"; then
                  echo "::error file=$filename,line=$line_num::❌ ERROR: Inline styles with static values are not allowed. Use CSS modules or a className instead."
                  HAS_ERRORS=true
                fi
              fi
          
              # Increment tracking line counter dynamically for lines inside the hunk
              ((line_num++))
            fi
          done < <(git diff origin/${{ github.base_ref }}...HEAD -U0)

          # Export the error flag status safely to the global workflow memory environment
          if [ "$HAS_ERRORS" = true ]; then
            echo "GLOBAL_FAIL=true" >> $GITHUB_ENV
          fi

      # 🚫 Run ESLint (This natively handles the inline styles block we added to your Flat Config!)
      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint with Automatic Annotations
        # --format stylish pipes ESLint errors natively straight into line comments
        run: npm run lint -- --format stylish

      # 🏁 Final Enforcement Checkpoint
      - name: Check Overall Status & Fail Build
        if: env.GLOBAL_FAIL == 'true'
        run: |
          echo "❌ Guardrails failed because one or more line rule policies were breached. See code comments above!"
          exit 1
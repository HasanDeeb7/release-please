name: Free AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # CRITICAL FIX: Downloads full history so git diff doesn't throw a 128 error
          fetch-depth: 0

      - name: Gemini AI Reviewer
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_FLASH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-2.5-flash'
          prompt: |
            You are a Next.js and TypeScript senior engineer reviewing a Pull Request.

            CRITICAL RULES (Check for these first):
            1. **Local Imports:** Check the code diff for any imports coming from '.yalc/'. If found, explicitly state "**PR REJECTED: Local .yalc imports detected. Remove local links.**" at the very top of your comment.
            2. **Console Logs:** Absolutely no `console.log()` statements are allowed in production-ready code (unless they are explicitly `console.error` or `console.warn` inside an error catch block). Point out any `console.log` found and request its removal.

            GENERAL CODE REVIEW GUIDELINES:
            - **ESLint & Standards:** Flag anything that violates standard ESLint and Next.js recommended rules (e.g., missing dependencies in React hooks like useEffect, wrong placement of 'use client', unoptimized images using `<img>` instead of Next.js `<Image />`).
            - **Redundancy:** Highlight any redundant logic, duplicated helper functions, unused imports/variables, or boilerplate code that could be simplified or modularized.
            - **Architecture:** Keep an eye out for Next.js App Router performance patterns and potential bugs.

            Be highly concise. Only leave comments where an actual issue, redundancy, or rule violation is found. Do not nitpick basic style or formatting.